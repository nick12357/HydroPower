<!DOCTYPE html>
<html lang="en" data-theme="pylon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Electricity</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>
[data-theme=pylon]{--bg:#dbe9d6;--panel:#f1f7ee;--ink:#10261a;--muted:#4a6352;--line:#9bb99f;--steel:#1b6b2b;--hi:#f1faf0;--hot:#e8590c;--glass:#1f7a31;--stage:#f8fcf5;--grid:#d0e2ca}
[data-theme=blackout]{--bg:#14181d;--panel:#1d232a;--ink:#e6ebef;--muted:#8d9aa5;--line:#35404a;--steel:#0c0f12;--hi:#e6ebef;--hot:#ffb000;--glass:#3fc1c9;--stage:#0f1317;--grid:#232c34}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.35 "Barlow Semi Condensed","Arial Narrow",sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;color:var(--hi);
background:repeating-radial-gradient(circle at 8% 140%,transparent 0 9px,rgba(255,255,255,.13) 9px 11px),var(--steel);border-bottom:4px solid var(--hot)}
h1{margin:0;font:700 22px/1 Silkscreen,"Courier New",monospace;display:flex;align-items:center;gap:10px}
h1 em{font-style:normal;color:var(--hot)}
h2{margin:12px 0 6px;font-size:16px;font-weight:700}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--hot)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--glass);outline-offset:1px}
header button,header select{background:rgba(255,255,255,.1);color:var(--hi);border-color:rgba(255,255,255,.35)}
header select option{color:#111}
#run{background:var(--hot);border-color:var(--hot);color:#fff;font-weight:700}
.sp{flex:1}
main{display:grid;grid-template-columns:190px minmax(300px,1fr) minmax(340px,520px);gap:10px;padding:10px;align-items:start}
section{background:var(--panel);border:1px solid var(--line);padding:4px 12px 12px;min-width:0}
.blk{position:relative;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0;padding:6px 8px;min-height:34px;background:var(--k,#888);color:#fff;font-weight:600;border-radius:4px;border-bottom:1px solid rgba(0,0,0,.25)}
.blk::before{content:"";position:absolute;left:16px;top:0;width:20px;height:4px;background:var(--panel);border-radius:0 0 4px 4px}
.blk::after{content:"";position:absolute;left:16px;bottom:-4px;width:20px;height:4px;background:var(--k,#888);border-radius:0 0 4px 4px;z-index:2}
.sc .blk:last-of-type::after{display:none}
.blk input,.blk select,.hat input,.hat select{width:auto;max-width:150px;padding:1px 8px;background:#fff;color:#222;border:0;border-radius:12px}
.blk input[type=number]{width:62px}.blk input[type=color]{width:34px;padding:0;height:22px}
.blk .x{margin-left:auto;display:flex;gap:2px}.blk .x button{padding:0 6px;border:0;background:none;color:rgba(255,255,255,.8)}
.pal button{display:block;width:100%;text-align:left;margin:3px 0;border:0;border-radius:4px;background:var(--k);color:#fff;font-weight:600;padding:5px 8px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.pal button:hover{filter:brightness(1.12)}
.sc{border:2px solid var(--line);padding:6px;margin:10px 0;border-radius:3px}
.sc.on{border-color:var(--glass)}
.hat{display:flex;gap:6px;align-items:center;font-weight:700;padding:10px 10px 6px;background:#d99a00;color:#2b1b00;border-radius:26px 26px 4px 4px/16px 16px 4px 4px;width:fit-content;min-width:60%}
.hat button{margin-left:auto;background:none;border:0;color:#2b1b00}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
canvas{width:100%;aspect-ratio:4/3;display:block;border:2px solid var(--steel);background:var(--stage);touch-action:none}
#stat{font-size:13px;color:var(--muted);margin-top:4px}
.chip{padding:2px 10px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--bg)}
.chip.on{background:var(--glass);border-color:var(--glass);color:#fff}
.v{display:inline-block;margin:2px 8px 2px 0;font-weight:600}
#insp{display:none;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center}
body.plus #insp{display:grid}
#insp input{width:100%;padding:2px 4px;background:var(--bg);border:1px solid var(--line)}
pre{margin:0;height:110px;overflow:auto;background:var(--stage);border:1px solid var(--line);padding:6px;font:12px/1.4 ui-monospace,Menlo,monospace}
textarea{width:100%;height:90px;background:var(--stage);border:1px solid var(--line);font:12px ui-monospace,monospace}
label{font-size:14px}
#code{display:none}#code textarea{width:100%;height:420px;tab-size:4;white-space:pre;overflow:auto;background:var(--stage);color:var(--ink);border:1px solid var(--line);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:8px}
body.plus #code{display:block}body.plus #scripts,body.plus #addrow,body.plus .pal{display:none}body.plus main{grid-template-columns:minmax(300px,1fr) minmax(340px,520px)}
#cerr{font-size:13px;color:var(--muted)}
dialog{background:var(--panel);color:var(--ink);border:3px solid var(--steel);border-radius:4px;max-width:440px;width:92vw;padding:12px 16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
#tgrid{display:grid;grid-template-columns:1fr auto auto;gap:6px 8px;align-items:center;margin:8px 0}
#tgrid input[type=color]{width:38px;height:26px;padding:0}
dialog input[type=text],#tname{background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:3px 6px}
#tgrid input[type=text]{width:84px;font:12px ui-monospace,monospace}
#twarn{min-height:1.4em;color:var(--hot);font-weight:600}
#plat{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
#pbrand{font:700 20px/1 Silkscreen,"Courier New",monospace;display:flex;align-items:center;gap:8px;margin-right:8px}
#ptabs{display:flex;gap:4px;flex-wrap:wrap}
#ptabs button[aria-selected=true]{background:var(--glass);border-color:var(--glass);color:#fff}
#toast{font-weight:600;color:var(--glass)}
.view{padding:12px 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:10px 0}
.card{background:var(--panel);border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.card h3{margin:0;font-size:17px}.card p{margin:0;color:var(--muted)}
.sw{display:flex;gap:2px}.sw i{width:22px;height:22px;border:1px solid var(--line)}
#v-store input[type=text],#v-store input[type=number],#v-shop input{background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:3px 6px}
body.playing main>section:not(:last-child),body.playing #mode,body.playing #tedit{display:none}
body.playing main{grid-template-columns:minmax(300px,640px);justify-content:center}
body.playing main>section:last-child>*{display:none}
body.playing main>section:last-child>:is(canvas,#stat,#vars,#con){display:block}
@media(max-width:900px){main,body.plus main{grid-template-columns:1fr}}
@media(prefers-reduced-motion:no-preference){button{transition:border-color .15s}}
</style>
</head>

<div id="v-create"><header>
<h1><span id="logo"></span>Electricity<em id="plusTag"></em></h1>
<button id="run">▶ Clock in</button><button id="pause">Pause</button><button id="stp">Step</button><button id="stop">■ Clock out</button>
<span class="sp"></span>
<label>Theme <select id="theme"></select></label>
<button id="tedit">Theme editor</button><button id="mode">Switch to Plus</button>
</header>
<main>
<section class="pal"><h2>Blocks</h2><div id="blocks"></div></section>
<section><h2 id="edh">Scripts</h2><div id="code"><textarea id="src" spellcheck="false" aria-label="C# script"></textarea><div class="row"><button id="chk">Build</button><span id="cerr"></span></div></div><div id="scripts"></div>
<div class="row" id="addrow"><button id="addflag">+ when shift starts ▶</button><button id="addkey">+ when key pressed</button></div></section>
<section>
<h2>Stage</h2>
<canvas id="cv" width="480" height="360" aria-label="Game stage"></canvas>
<div id="stat"></div>
<div class="row"><label><input type="checkbox" id="oHit"> Hitboxes</label><label><input type="checkbox" id="oGrid"> Grid</label><label><input type="checkbox" id="oSnap"> Snap</label>
<label>Speed <select id="spd"><option value="1">1×</option><option value=".25">0.25×</option><option value=".1">0.1×</option><option value="2">2×</option></select></label></div>
<h2>Sprites</h2><div id="sprites" class="row"></div>
<div class="row"><button id="adds">+ Sprite</button><button id="dels">Delete sprite</button></div>
<h2>Pixel assets</h2><div class="row" id="assets"></div>
<details id="ped" open><summary>Pixel art editor (16×16)</summary>
<canvas id="pe" width="256" height="256" aria-label="Pixel art canvas" style="aspect-ratio:1;max-width:288px;cursor:crosshair;margin:6px 0"></canvas>
<div class="row" id="pal2"></div>
<div class="row"><input type="color" id="pc" value="#2fb344" aria-label="Pick colour"><button id="tPen">Pencil</button><button id="tEr">Eraser</button><button id="tFill">Fill</button><button id="tClr">Clear</button></div>
<div class="row"><input id="pn" value="myart" aria-label="Asset name" style="width:110px;padding:3px 6px;background:var(--bg);border:1px solid var(--line)"><button id="pload">Edit current look</button><button id="psave">Save as asset</button></div></details>
<div id="insp"></div>
<h2>Variables</h2><div id="vars">None yet</div>
<h2>Console</h2><pre id="con"></pre>
<h2 id="binh"> Procrastination Bin</h2><div class="row"><input id="pname" value="Untitled (finish later)" aria-label="Project name" style="flex:1;min-width:140px;padding:3px 6px;background:var(--bg);border:1px solid var(--line)"><button id="toss">Toss in bin</button></div><div id="bin"></div>
<details><summary>Project file</summary><textarea id="json" aria-label="Project JSON"></textarea><div class="row"><button id="exp">Export</button><button id="imp">Load</button></div></details>
</section>
</main></div>
<dialog id="tdlg" aria-labelledby="tdh"><h2 id="tdh" style="margin-top:0">Theme editor</h2>
<div class="row"><label>Name <input type="text" id="tname" value="My theme"></label></div>
<div id="tgrid"></div><div id="twarn" role="status"></div>
<div class="row"><button id="tsave">Save theme</button><button id="tdel">Delete theme</button><button id="tcancel">Cancel</button></div>
<details><summary>Share as JSON</summary><textarea id="tjson" aria-label="Theme JSON"></textarea><div class="row"><button id="texp">Export</button><button id="timp">Import</button></div></details></dialog>
<script>

const B=(c,...p)=>({c,p});
const KEYS=['ArrowRight','ArrowLeft','ArrowUp','ArrowDown',' ','w','a','s','d'];

wait:B('control','wait',[0.5],'sec'),repeat:B('control','repeat',[10]),forever:B('control','forever'),
ifedge:B('control','if touching edge'),ifkey:B('control','if key',['ArrowRight',KEYS],'pressed'),iftouch:B('control','if touching sprite',['Telemarketer']),end:B('control','end'),
dial:B('calls','dial',['555-0199']),pitch:B('calls','pitch',['Have you heard about your extended warranty?']),hold:B('calls','put on hold for',[2],'sec'),ifpick:B('calls','if prospect picks up',[30],'% chance'),sale:B('calls','close the sale for',[1]),hangup:B('calls','hang up'),
achieve:B('hydro','unlock achievement',['First spark'],'for',[10],'hydrobucks'),
set:B('data','set variable',['score'],'to',[0]),add:B('data','change variable',['score'],'by',[1]),
log:B('dev','log to console',['hello']),stop:B('dev','stop all')};
const CAT={motion:'#3d6f9e',looks:'#17868b',control:'#c2410c',data:'#8a6d1f',dev:'#5b6770',calls:'#c0392b',hydro:'#0b7285'};
const OPEN=['repeat','forever','ifedge','ifkey','iftouch','ifpick'];
const THEMES={pylon:'Pylon',blackout:'Blackout'};
let P={sprites:[],sel:0,sc:0},V={},threads=[],running=false,paused=false,step1=false,keys={},plus=false,snap=null,speed=1,T={};
const mk=t=>({t,a:SPEC[t].p.filter(Array.isArray).map(x=>x[0])});
const cur=()=>P.sprites[P.sel];
const R=s=>Math.max(2,20*s.s/100);
const ART={
cone:{p:{k:'#0f4a1a',g:'#2fb344',h:'#8be89b',d:'#1a7a2c'},r:['..........','...kkkk...','..gkkkkg..','..ghhggg..','.gghhgggg.','.ghhggggdg','gghgggggdd','gggggggddd','.dddddddd.','..........']},
phone:{p:{K:'#c0392b',w:'#ffd9d4'},r:['..........','.KKKKKKKK.','KKwKKKKwKK','KK......KK','KK......KK','KK......KK','KK......KK','.K......K.','..........','..........']},
bin:{p:{m:'#6b7b86',l:'#9fb0ba',d:'#3f4b53',p:'#f6e27a'},r:['..p.p.....','.pppp.....','llllllllll','.mmmmmmmm.','.mdmmdmmd.','.mdmmdmmd.','.mdmmdmmd.','.mdmmdmmd.','.mmmmmmmd.','..dddddd..']},
bolt:{p:{y:'#ffd23f'},r:['.....yy...','....yyy...','...yyy....','..yyy.....','.yyyyyyy..','...yyyyy..','....yyy...','...yy.....','..yy......','..y.......']}};
const AC=new WeakMap();let BIN=[];let CI=[];
function art(n){const a=(P.art&&P.art[n])||ART[n]||SART[n];if(!a)return null;let c=AC.get(a);if(!c){c=document.createElement('canvas');const w=a.px?a.w:a.r[0].length;c.width=w;c.height=a.px?a.px.length/w:a.r.length;const x=c.getContext('2d');if(a.px)a.px.forEach((v,k)=>{if(v){x.fillStyle=v;x.fillRect(k%w,(k/w)|0,1,1)}});else a.r.forEach((row,j)=>[...row].forEach((ch,i)=>{if(a.p[ch]){x.fillStyle=a.p[ch];x.fillRect(i,j,1,1)}}));AC.set(a,c)}return c}
/* ---- pixel art editor ---- */
const PAL=['#0f4a1a','#1a7a2c','#2fb344','#8be89b','#c0392b','#e8590c','#ffd23f','#f6e27a','#ffd9d4','#6b7b86','#9fb0ba','#3f4b53','#1f3a5f','#4c97ff','#ffffff','#111111'];
let E=Array(256).fill(''),tool='pen';
function pdraw(){const c=$('#pe').getContext('2d');for(let k=0;k<256;k++){const x=k%16*16,y=(k>>4)*16;c.fillStyle=((k%16+(k>>4))&1)?'#d8d8d8':'#f2f2f2';c.fillRect(x,y,16,16);if(E[k]){c.fillStyle=E[k];c.fillRect(x,y,16,16)}}}
function pset(e){const r=$('#pe').getBoundingClientRect(),i=Math.floor((e.clientX-r.left)/r.width*16),j=Math.floor((e.clientY-r.top)/r.height*16);if(i<0||j<0||i>15||j>15)return;const k=j*16+i,col=$('#pc').value;
if(tool==='fill'){const t=E[k];if(t===col)return;const st=[k];while(st.length){const q=st.pop();if(E[q]!==t)continue;E[q]=col;const x=q%16;if(x>0)st.push(q-1);if(x<15)st.push(q+1);if(q>15)st.push(q-16);if(q<240)st.push(q+16)}}
else E[k]=tool==='erase'?'':col;pdraw()}
function pload(){const a=art(cur().look);E=Array(256).fill('');if(a){const w=a.width,h=a.height,d=a.getContext('2d').getImageData(0,0,w,h).data,ox=Math.max(0,(16-w)>>1),oy=Math.max(0,(16-h)>>1);
for(let j=0;j<Math.min(h,16);j++)for(let i=0;i<Math.min(w,16);i++){const o=(j*w+i)*4;if(d[o+3]>10)E[(j+oy)*16+i+ox]='#'+[d[o],d[o+1],d[o+2]].map(v=>v.toString(16).padStart(2,'0')).join('')}}
$('#pn').value='my-'+(ART[cur().look]?cur().look:'art');pdraw()}
function psave(){const n=$('#pn').value.trim().replace(/[^\w-]/g,'')||'myart';P.art=P.art||{};P.art[n]={w:16,px:E.slice()};assets();cur().look=n;sprites();insp();log('Saved pixel asset “'+n+'” and applied it to '+cur().n)}
function pinit(){const p=$('#pal2');PAL.forEach(c=>{const b=document.createElement('button');b.style.cssText='width:22px;height:22px;padding:0;background:'+c;b.setAttribute('aria-label','Colour '+c);b.onclick=()=>{$('#pc').value=c;tool='pen'};p.append(b)});
$('#tPen').onclick=()=>tool='pen';$('#tEr').onclick=()=>tool='erase';$('#tFill').onclick=()=>tool='fill';$('#tClr').onclick=()=>{E.fill('');pdraw()};$('#pload').onclick=pload;$('#psave').onclick=psave;
const pe=$('#pe');let on=false;pe.onpointerdown=e=>{on=true;pe.setPointerCapture(e.pointerId);pset(e)};pe.onpointermove=e=>{if(on&&tool!=='fill')pset(e)};pe.onpointerup=()=>on=false;pdraw()}

public class Pylon : MonoBehaviour
{
    public float speed = 5f;

    void Update()
    {
        if (Input.GetKey(KeyCode.RightArrow)) transform.Translate(speed, 0);

const CODE1=`using UnityEngine;

public class Telemarketer : MonoBehaviour
{
    float vx = 3f;
    float vy = 2f;
    float cooldown;
    int blocked;

    void Start()
    {
        Debug.Log("Shift started. Dialing...");
    }

    void Update()
    {
        transform.Translate(vx, vy);
        Game.Clamp();
        if (Game.OnEdgeX()) vx = -vx;
        if (Game.OnEdgeY()) vy = -vy;

        cooldown -= Time.deltaTime;
        if (Touching("Pylon") && cooldown <= 0)

        }

`;
function cs2js(src){const m=src.replace(/\/\/.*$/gm,'').replace(/using[^;]*;/g,'').match(/class\s+\w+[^{]*\{([\s\S]*)\}\s*$/);if(!m)throw new Error('expected: public class Name : MonoBehaviour { ... }');

/* ---- runtime ---- */
function bounce(s){const r=R(s);
if(s.x>240-r){s.x=240-r;s.d=-s.d}if(s.x<-240+r){s.x=-240+r;s.d=-s.d}
if(s.y>180-r){s.y=180-r;s.d=180-s.d}if(s.y<-180+r){s.y=-180+r;s.d=180-s.d}}
const edge=s=>Math.abs(s.x)>=240-R(s)||Math.abs(s.y)>=180-R(s);
function touch(s,n){const o=P.sprites.find(q=>q.n===n&&q!==s);return !!o&&Math.hypot(o.x-s.x,o.y-s.y)<R(o)+R(s)}
function compile(b){const m={},st=[];b.forEach((x,i)=>{if(OPEN.includes(x.t))st.push(i);else if(x.t==='end'){const o=st.pop();if(o!=null){m[o]=i;m[i]=o}}});return m}
const begin=(sp,sc)=>threads.push({sp,b:sc.b,m:compile(sc.b),pc:0,st:[],w:0});
function runThread(th,dt){
if(th.w>0){th.w-=dt;return true}
for(let n=0;n<999&&th.pc<th.b.length;n++){
const x=th.b[th.pc],a=x.a,s=th.sp,o=th.m[th.pc];th.pc++;
switch(x.t){
case'move':{const r=s.d*Math.PI/180;s.x+=Math.sin(r)*a[0];s.y+=Math.cos(r)*a[0];break}
case'turn':s.d+=+a[0];break;
case'goto':s.x=+a[0];s.y=+a[1];break;
case'chx':s.x+=+a[0];break;case'chy':s.y+=+a[0];break;
case'bounce':bounce(s);break;
case'say':s.say=a[0];s.t=60;break;
case'color':s.c=a[0];break;case'size':s.s=+a[0];break;
case'wait':th.w=+a[0];return true;
case'set':V[a[0]]=+a[1];break;
case'add':V[a[0]]=(V[a[0]]||0)+ +a[1];break;
case'log':log(s.n+': '+a[0]);break;
case'dial':s.say='☎ '+a[0];s.t=60;log('Dialing '+a[0]+'... ring ring');break;
case'pitch':s.say=a[0];s.t=90;log(s.n+': “'+a[0]+'”');break;
case'hold':s.say='♪ hold music ♪';s.t=90;log('Please hold. Your call is important to us.');th.w=+a[0];return true;
case'hangup':s.say='';log('Click. Dial tone.');return false;
case'sale':V.sales=(V.sales||0)+ +a[0];log('SALE! Commission +'+a[0]);break;
case'achieve':award(a[0],+a[1]);break;
case'stop':stopAll(true);return false;
case'repeat':if(o==null)return false;if(+a[0]>0)th.st.push({o:th.pc-1,n:+a[0]});else th.pc=o+1;break;
case'forever':if(o==null)return false;break;
case'ifedge':case'ifkey':case'iftouch':case'ifpick':{if(o==null)return false;
const ok=x.t==='ifedge'?edge(s):x.t==='ifkey'?!!keys[a[0]]:x.t==='ifpick'?Math.random()*100<+a[0]:touch(s,a[0]);if(!ok)th.pc=o+1;break}
case'end':{const op=th.b[o];if(!op)break;
if(op.t==='repeat'){const t=th.st[th.st.length-1];if(t&&--t.n>0){th.pc=o+1;return true}th.st.pop()}
else if(op.t==='forever'){th.pc=o+1;return true}break}}}
return th.pc<th.b.length}

function draw(){const g=$('#cv').getContext('2d');
g.setTransform(1,0,0,1,0,0);g.fillStyle=T.stage;g.fillRect(0,0,480,360);g.translate(240,180);
if($('#oGrid').checked||plus){g.strokeStyle=T.grid;g.lineWidth=1;g.beginPath();
for(let i=-240;i<=240;i+=20){g.moveTo(i,-180);g.lineTo(i,180)}for(let j=-180;j<=180;j+=20){g.moveTo(-240,j);g.lineTo(240,j)}g.stroke()}
P.sprites.forEach((s,i)=>{const r=R(s);g.save();g.translate(s.x,-s.y);g.rotate((s.d-90)*Math.PI/180);
const im=art(s.look);if(im){g.imageSmoothingEnabled=false;g.drawImage(im,-r*1.2,-r*1.2,r*2.4,r*2.4)}else{g.fillStyle=s.c;g.globalAlpha=s.look?.35:1;g.fillRect(-r,-r,2*r,2*r);g.globalAlpha=1}
if(s.look&&!im){g.font=(r*1.4)+'px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(s.look,0,2)}g.restore();
if($('#oHit').checked){g.strokeStyle=T.hot;g.lineWidth=1.5;g.beginPath();g.arc(s.x,-s.y,r,0,7);g.stroke();
g.fillStyle=T.hot;g.font='10px sans-serif';g.textAlign='left';g.fillText(Math.round(s.x)+','+Math.round(s.y),s.x+r+3,-s.y)}
if(i===P.sel&&(plus||!running)){g.strokeStyle=T.glass;g.setLineDash([4,3]);g.lineWidth=2;g.strokeRect(s.x-r-3,-s.y-r-3,2*r+6,2*r+6);g.setLineDash([])}
